name: Build paired client release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Retry an unpublished tag using its original, preflight-verified push run ID'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Resolve the original release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          commit=$GITHUB_SHA
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
            gh run view "$SOURCE_RUN" --json headBranch,headSha,workflowName,event,jobs > "$RUNNER_TEMP/source.json"
            jq -e '.event == "push" and .workflowName == "Build paired client release" and any(.jobs[]; .name == "preflight" and .conclusion == "success")' "$RUNNER_TEMP/source.json" >/dev/null
            tag=$(jq -r .headBranch "$RUNNER_TEMP/source.json")
            commit=$(jq -r .headSha "$RUNNER_TEMP/source.json")
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.source.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the version and refuse published or moved tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Version tag mismatch::Expected $EXPECTED_TAG from package.json, received $RELEASE_TAG"
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$TAG_CREATED" != "true" || "$TAG_FORCED" == "true" ) ]]; then
            echo "::error title=Reused version tag::$RELEASE_TAG must be a newly created tag; publish a new version instead of moving an existing tag"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Duplicate release::$RELEASE_TAG already has a GitHub Release; publish a new version instead"
            exit 1
          fi
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    # Keep the original job/artifact IDs used by staging and publication retries.
    runs-on: ${{ matrix.os == 'macos-14' && 'macos-15' || matrix.os }}
    timeout-minutes: 45
    env:
      PORTAL_DESKTOP_UPDATE_REPOSITORY: ${{ vars.PORTAL_DESKTOP_UPDATE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Apple Developer ID certificate (same secrets as Heart Portal)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_BASE64:?Configure the Heart Portal signing certificate in this repository}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Configure the Heart Portal certificate password in this repository}"
          KEYCHAIN_PATH="$RUNNER_TEMP/portal-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"' EXIT
          umask 077
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "PORTAL_DESKTOP_MAC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:portal
      - run: npm test
      - name: Verify native Windows credential and task registration
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/background-native.test.ts
      - run: cargo test --manifest-path heart-portal/Cargo.toml --locked -- --test-threads=1
      - name: Verify native Windows service upgrade and rollback
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/runtime-update-native.test.ts
      - run: npm run make
      - name: Verify packaged resource links and paint a cloud computer frame
        run: node tests/packaged-resources.mjs
      - name: Verify interrupted upgrade recovery and installer retry
        run: node tests/update-recovery-electron.mjs
      - name: Verify signed macOS DMG installation and Release ZIP upgrade preflight
        if: runner.os == 'macOS'
        run: npm run test:macos-package
      - name: Verify signed macOS client replacement and relaunch
        if: runner.os == 'macOS'
        run: npm run test:macos-upgrade
      - name: Clean up Apple signing material
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/portal-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Download and verify the previous published Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-windows-baseline.mjs "$env:RUNNER_TEMP/windows-upgrade-baseline"
      - name: Verify NSIS installation and client Portal upgrade
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PORTAL_DESKTOP_REQUIRE_HISTORICAL_BASELINE: '1'
        run: npm run test:windows-upgrade
      - name: Upload Windows installer diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: test-results/windows-installer/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: portal-desktop-${{ matrix.os }}
          path: |
            out/make/
            resources/runtime-bundle.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate all three platform packages and stage checksums
        run: node scripts/stage-release.mjs artifacts release "$(node -p 'require("./package.json").version')"
      - name: Publish the complete paired release
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Portal Desktop $RELEASE_TAG" --notes-file desktop/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
# Only a verified tag builds and publishes. Publication waits for all three
# native builds; the release stays a draft if asset upload fails.
