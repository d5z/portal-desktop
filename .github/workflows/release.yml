name: Build paired client release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate a new unique version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Version tag mismatch::Expected $EXPECTED_TAG from package.json, received $GITHUB_REF_NAME"
            exit 1
          fi
          if [[ "$TAG_CREATED" != "true" || "$TAG_FORCED" == "true" ]]; then
            echo "::error title=Reused version tag::$GITHUB_REF_NAME must be a newly created tag; publish a new version instead of moving an existing tag"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error title=Duplicate release::$GITHUB_REF_NAME already has a GitHub Release; publish a new version instead"
            exit 1
          fi
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PORTAL_DESKTOP_UPDATE_REPOSITORY: ${{ vars.PORTAL_DESKTOP_UPDATE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Apple Developer ID certificate (same secrets as Heart Portal)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_BASE64:?Configure the Heart Portal signing certificate in this repository}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Configure the Heart Portal certificate password in this repository}"
          KEYCHAIN_PATH="$RUNNER_TEMP/portal-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"' EXIT
          umask 077
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "PORTAL_DESKTOP_MAC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:portal
      - run: npm test
      - name: Verify native Windows credential and task registration
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/background-native.test.ts
      - run: cargo test --manifest-path heart-portal/Cargo.toml --locked -- --test-threads=1
      - name: Verify native Windows service upgrade and rollback
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/runtime-update-native.test.ts
      - run: npm run make
      - name: Verify packaged resource links and paint a cloud computer frame
        run: node tests/packaged-resources.mjs
      - name: Verify interrupted upgrade recovery and installer retry
        run: node tests/update-recovery-electron.mjs
      - name: Verify signed macOS DMG installation and Release ZIP upgrade preflight
        if: runner.os == 'macOS'
        run: npm run test:macos-package
      - name: Verify signed macOS client replacement and relaunch
        if: runner.os == 'macOS'
        run: npm run test:macos-upgrade
      - name: Clean up Apple signing material
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/portal-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Download and verify the previous published Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-windows-baseline.mjs "$env:RUNNER_TEMP/windows-upgrade-baseline"
      - name: Verify NSIS installation and client Portal upgrade
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PORTAL_DESKTOP_REQUIRE_HISTORICAL_BASELINE: '1'
        run: npm run test:windows-upgrade
      - name: Upload Windows installer diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: test-results/windows-installer/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: portal-desktop-${{ matrix.os }}
          path: |
            out/make/
            resources/runtime-bundle.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate all three platform packages and stage checksums
        run: node scripts/stage-release.mjs artifacts release "$(node -p 'require("./package.json").version')"
      - name: Publish the complete paired release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Portal Desktop $GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
# Only a matching version tag builds and publishes. Publication waits for all three
# native builds; the release stays a draft if asset upload fails.
