name: Windows Portal recovery
on:
  push:
    paths:
      - '.github/workflows/windows-portal-recovery.yml'
      - 'desktop/main/portal/windows-orphan.ps1'
      - 'desktop/main/portal/foreground-record.ts'
      - 'desktop/main/portal/supervisor.ts'
      - 'tests/portal-orphan-windows.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Cache patched Windows Node build
        id: task-node-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            output/node-*/node.exe
            output/node-*/node.sha256
          key: windows-task-node-${{ hashFiles('scripts/portal-runtime/lock.json', 'scripts/portal-runtime/libuv-appcontainer.patch', 'scripts/portal-runtime/build-windows-node.mjs') }}
      - run: npm run build:portal
      - name: Save completed Windows Node build
        if: always() && runner.os == 'Windows' && steps.task-node-cache.outputs.cache-hit != 'true' && hashFiles('output/node-*/node.sha256') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            output/node-*/node.exe
            output/node-*/node.sha256
          key: ${{ steps.task-node-cache.outputs.cache-primary-key }}
      - run: npx vitest run tests/portal-orphan-windows.test.ts
